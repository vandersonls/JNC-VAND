<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>BTM Banco Matrix</title>
    <style>
        body{
        font-family:Arial;
        margin:30px;
        background:#f2f2f2;
        }
        .container{
        display:flex;
        gap:30px;
        }
        .lista{
            width:50%;
            background:white;
            padding:15px;
            border-radius:10px;
            box-shadow:0 0 5px gray;
        }
        table{
            width:100%;
            border-collapse:collapse;
        }
        td,th{
            border:1px solid #ccc;
            padding:5px;
            text-align:left;
        }
        button{
            cursor:pointer;
            padding:5px 10px;
            margin:2px;
        }
        input[type=text], input[type=number]{
            width:100%;
            margin-bottom:10px;
            padding:6px;
            box-sizing:border-box;
        }
        input[type=number]{
            width:70px;
        }
    </style>
</head>

<body>
    <h2>Montador de Lista Matrix</h2>

    <br><br>

    <input type="text" id="pesquisa" placeholder="Pesquisar item...">

    <div class="container">
        <div class="lista">
            <h3>Lista Matrix</h3>
            <table id="tabelaOriginal">
                <thead></thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="lista">
            <h3>Nova Lista</h3>
            <table id="tabelaNova">
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Quantidade</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            <br>
            <button onclick="baixarCSV()">Download Lista</button>
        </div>
    </div>

    <script>
            let dados = [];
            let novaLista = [];
            const cabecalhoOriginal = ["codigo", "descricao", "dimensao", "unidade"];

            // BUSCAR DADOS DO PYTHON ASSIM QUE A PÁGINA CARREGAR
            window.addEventListener("DOMContentLoaded", () => {
                fetch("/consultar_materiais")
                    .then(response => response.json())
                    .then(data => {
                        dados = data; // Armazena os dados do banco
                        montarTabela(dados);
                    })
                    .catch(error => console.error("Erro ao buscar materiais:", error));
            });

            function montarTabela(lista) {
                const thead = document.querySelector("#tabelaOriginal thead");
                const tbody = document.querySelector("#tabelaOriginal tbody");

                thead.innerHTML = "";
                tbody.innerHTML = "";

                if (!lista.length) {
                    tbody.innerHTML = "<tr><td colspan='6'>Nenhum dado disponível</td></tr>";
                    return;
                }

                // Monta o cabeçalho superior da tabela de origem
                let h = "<tr>";
                cabecalhoOriginal.forEach(c => h += "<th>" + c.toUpperCase() + "</th>");
                h += "<th>Qtd</th><th>Ação</th></tr>";
                thead.innerHTML = h;

                // Alimenta as linhas da tabela
                lista.forEach(item => {
                    let tr = "<tr>";

                    cabecalhoOriginal.forEach(c => {
                        tr += "<td>" + (item[c] !== null ? item[c] : "") + "</td>";
                    });

                    // Passamos o código e descrição como atributos de texto para a função adicionar
                    tr += `
                        <td><input type='number' value='1' min='1' style='width:60px'></td>
                        <td><button onclick="adicionar(this, '${item.codigo}', '${item.descricao}')">Adicionar</button></td>
                    `;

                    tbody.innerHTML += tr;
                });
            }

            function adicionar(botao, codigo, descricao) {
                const linha = botao.parentElement.parentElement;
                const qtdInput = linha.querySelector("input[type='number']");
                const qtd = parseInt(qtdInput.value) || 1;

                // Texto descritivo que vai aparecer na nova lista
                const identificadorItem = `${codigo} - ${descricao}`;

                // Verifica se o item já existe na nova lista
                const existingIndex = novaLista.findIndex(item => item.item === identificadorItem);
                if (existingIndex >= 0) {
                    novaLista[existingIndex].quantidade += qtd;
                } else {
                    novaLista.push({
                        item: identificadorItem,
                        quantidade: qtd
                    });
                }

                atualizarNova();
            }

            function atualizarNova() {
                const tbody = document.querySelector("#tabelaNova tbody");
                tbody.innerHTML = "";

                if (novaLista.length === 0) {
                    tbody.innerHTML = "<tr><td colspan='3'>Lista vazia</td></tr>";
                    return;
                }

                novaLista.forEach((item, index) => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${item.item}</td>
                            <td>${item.quantidade}</td>
                            <td><button onclick="remover(${index})">Remover</button></td>
                        </tr>
                    `;
                });
            }

            function remover(i) {
                novaLista.splice(i, 1);
                atualizarNova();
            }

            // Sistema de busca e filtragem em tempo real
            document.getElementById("pesquisa").addEventListener("input", function() {
                const texto = this.value.toLowerCase();

                if (!dados.length) return;

                const filtrado = dados.filter(obj => {
                    return Object.values(obj).join(" ").toLowerCase().includes(texto);
                });

                montarTabela(filtrado);
            });

            function baixarCSV() {
                if (novaLista.length === 0) {
                    alert("A lista está vazia!");
                    return;
                }

                let csv = "Item,Quantidade\n";
                novaLista.forEach(item => {
                    csv += `"${item.item}",${item.quantidade}\n`;
                });

                const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = "NovaLista_" + new Date().toISOString().slice(0,10) + ".csv";
                a.click();
                URL.revokeObjectURL(url);
            }
        </script>



</body>

</html>
