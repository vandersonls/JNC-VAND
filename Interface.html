<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>BTM Banco Matrix</title>
    <style>
        body{
        font-family:Arial;
        margin:30px;
        background:#f2f2f2;
        }
        .container{
        display:flex;
        gap:30px;
        }
        .lista{
            width:50%;
            background:white;
            padding:15px;
            border-radius:10px;
            box-shadow:0 0 5px gray;
        }
        table{
            width:100%;
            border-collapse:collapse;
        }
        td,th{
            border:1px solid #ccc;
            padding:5px;
            text-align:left;
        }
        button{
            cursor:pointer;
            padding:5px 10px;
            margin:2px;
        }
        input[type=text], input[type=number]{
            width:100%;
            margin-bottom:10px;
            padding:6px;
            box-sizing:border-box;
        }
        input[type=number]{
            width:70px;
        }
    </style>
</head>
<body>
    <h2>Montador de Lista Matrix</h2>

    <br><br>

    <input type="text" id="pesquisa" placeholder="Pesquisar item...">

    <div class="container">
        <div class="lista">
            <h3>Lista Matrix</h3>
            <table id="tabelaOriginal">
                <thead></thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="lista">
            <h3>Nova Lista</h3>
            <table id="tabelaNova">
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Quantidade</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            <br>
            <button onclick="baixarCSV()">Download CSV</button>
        </div>
    </div>

    <script>

        let dados = [];
        let novaLista = [];
        let cabecalhoOriginal = [];

        // Try to load default CSV, but don't fail if it doesn't exist
        window.onload = function() {
            fetch("dump/LISTA MATRIX.csv")
                .then(response => {
                    if (!response.ok) {
                        console.log("Arquivo padrão não encontrado. Use o upload para carregar um CSV.");
                        return null;
                    }
                    return response.text();
                })
                .then(texto => {
                    if (texto) processarCSV(texto);
                })
                .catch(erro => {
                    console.log("Use o botão de upload para carregar um arquivo CSV.");
                });
        };

        function processarCSV(texto) {
            const linhas = texto.trim().split(/\r?\n/);
            cabecalhoOriginal = linhas[0].spli0t(",").map(h => h.trim());

            dados = [];
            for (let i = 1; i < linhas.length; i++) {
                let colunas = linhas[i].split(",");
                let obj = {};

                cabecalhoOriginal.forEach((c, index) => {
                    obj[c] = colunas[index]?.trim() || "";
                });

                dados.push(obj);
            }

            montarTabela(dados);
        }

        function montarTabela(lista) {
            const thead = document.querySelector("#tabelaOriginal thead");
            const tbody = document.querySelector("#tabelaOriginal tbody");

            thead.innerHTML = "";
            tbody.innerHTML = "";

            if (!cabecalhoOriginal.length || !lista.length) {
                tbody.innerHTML = "<tr><td colspan='3'>Nenhum dado disponível</td></tr>";
                return;
            }

            let h = "<tr>";
            cabecalhoOriginal.forEach(c => h += "<th>" + c + "</th>");
            h += "<th>Qtd</th><th>Ação</th></tr>";
            thead.innerHTML = h;

            lista.forEach(item => {
                let tr = "<tr>";

                cabecalhoOriginal.forEach(c => {
                    tr += "<td>" + (item[c] || "") + "</td>";
                });

                tr += `
                    <td><input type='number' value='1' min='1' style='width:60px'></td>
                    <td><button onclick='adicionar(this)'>Adicionar</button></td>
                `;

                tbody.innerHTML += tr;
            });
        }

        function adicionar(botao) {
            const linha = botao.parentElement.parentElement;
            const qtdInput = linha.querySelector("input[type='number']");
            const qtd = parseInt(qtdInput.value) || 1;
            const tds = linha.querySelectorAll("td");
            const nome = tds[0].innerText;

            // Check if item already exists in nova lista
            const existingIndex = novaLista.findIndex(item => item.item === nome);
            if (existingIndex >= 0) {
                novaLista[existingIndex].quantidade =
                    parseInt(novaLista[existingIndex].quantidade) + qtd;
            } else {
                novaLista.push({
                    item: nome,
                    quantidade: qtd
                });
            }

            atualizarNova();
        }

        function atualizarNova() {
            const tbody = document.querySelector("#tabelaNova tbody");
            tbody.innerHTML = "";

            if (novaLista.length === 0) {
                tbody.innerHTML = "<tr><td colspan='3'>Lista vazia</td></tr>";
                return;
            }

            novaLista.forEach((item, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td>${item.item}</td>
                        <td>${item.quantidade}</td>
                        <td><button onclick="remover(${index})">Remover</button></td>
                    </tr>
                `;
            });
        }

        function remover(i) {
            novaLista.splice(i, 1);
            atualizarNova();
        }

        document.getElementById("pesquisa").addEventListener("input", function() {
            const texto = this.value.toLowerCase();

            if (!dados.length) return;

            const filtrado = dados.filter(obj => {
                return Object.values(obj).join(" ").toLowerCase().includes(texto);
            });

            montarTabela(filtrado);
        });

        function baixarCSV() {
            if (novaLista.length === 0) {
                alert("A lista está vazia!");
                return;
            }

            let csv = "Item,Quantidade\n";
            novaLista.forEach(item => {
                csv += `"${item.item}",${item.quantidade}\n`;
            });

            const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "NovaLista_" + new Date().toISOString().slice(0,10) + ".csv";
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
